
name: Build Custom Siflower Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compilation Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget subversion

    - name: Execute Custom Codex Compilation Scripts
      run: |
        echo "Running Codex build pipeline..."
        chmod +x ./build_script.sh
        ./build_script.sh

    - name: Upload Finished Firmware Binary
      uses: actions/upload-artifact@v4
      with:
        name: Opal-Custom-Firmware
        path: bin/targets/siflower/
